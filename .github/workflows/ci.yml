name: CI

on:
  push:
    branches: [ main, feat/mern-backend ]
  pull_request:
    branches: [ main, feat/mern-backend ]

jobs:
  test-server:
    name: Test Express & MongoDB Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run Jest test suite
        working-directory: server
        run: npm test

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sherox-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: sherox-app
        run: npm ci

      - name: Build frontend
        working-directory: sherox-app
        run: npm run build
        env:
          CI: false
